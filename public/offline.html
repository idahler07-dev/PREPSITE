<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; color: #1d2230; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #12151c; color: #e8eaf0; } }
      button { margin-top: 1rem; padding: 0.6rem 1.2rem; border-radius: 0.5rem; border: 0; background: #2a4fb0; color: #fff; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Check your connection. Drills you already opened keep working; your answers are sent when you're back online.</p>
      <p lang="uz">Internet aloqasi yoʻq. Ochilgan mashqlar ishlashda davom etadi.</p>
      <p lang="ru">Нет подключения. Открытые задания продолжают работать.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
